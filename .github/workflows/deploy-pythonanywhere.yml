name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright

      # apt's mirrors have repeatedly hung fetching noble-security/noble-updates
      # InRelease on GitHub-hosted runners, stalling this step for 6+ hours
      # (the default job timeout) with no error - so cap each attempt and retry.
      - name: Install Playwright's chromium (retries flaky apt mirrors)
        run: |
          for i in 1 2 3; do
            # timeout's default SIGTERM doesn't reliably kill apt-get's own
            # child processes, which can leave the dpkg lock held into the
            # next attempt - force-kill anything still around first.
            sudo pkill -9 -f apt-get || true
            sudo pkill -9 -f dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock || true

            if timeout -k 10 150 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $i failed or timed out after 150s; retrying..."
            sleep 5
          done
          echo "All attempts to install chromium failed."
          exit 1

      - name: Pull latest code and reload webapp
        run: node deploy.js
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-error-screenshots
          path: |
            git-pull-error.png
            reload-error.png
          if-no-files-found: ignore
